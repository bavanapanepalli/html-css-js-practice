<!DOCTYPE html>
<html>
<head>
    <title>DOM Example</title>
    <style>
        #message {
            font-size: 20px;
            color: blue;
        }
    </style>
</head>
<body>

    <h2>DOM Properties and Methods Example</h2>
    <p id="message">Hello, this is the original message!</p>
    <button onclick="changeMessage()">Click to Change Message</button>

    <script>
        function changeMessage() {
            // Access the paragraph element using document.getElementById
            var msg = document.getElementById("message");

            // Change the text content
            msg.textContent = "🎉 The message has been changed dynamically!";

            // Change some style properties
            msg.style.color = "green";
            msg.style.fontWeight = "bold";
            msg.style.backgroundColor = "#f0f0f0";
        }
    </script>

</body>
</html>
