<!DOCTYPE html>
<html>
<head>
    <title>CSS Styles Example</title>

    <link rel="stylesheet" href="styles.css">

    <style>
        
        h2 {
            color: blue;
            font-family: 'Courier New', Courier, monospace;
        }

        
        p {
            color: red;
        }
    </style>
</head>
<body>

    <h1 style="color: orange; font-family: Verdana, Geneva, Tahoma, sans-serif;">
        Inline Styled Heading (h1)
    </h1>

    <h2>Internal Styled Heading (h2)</h2>

    <h3>External Styled Heading (h3)</h3>

    <p style="font-weight: bold;">
        Paragraph with inline style (bold text). Internal CSS sets color red and external CSS sets font size.
    </p>

    <p>
        Paragraph without inline style. Internal CSS applies color red and external CSS applies font size 16px.
    </p>

</body>
</html>
