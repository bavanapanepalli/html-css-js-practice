<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>CSS Color Reference Demo</title>
  <style>
    .color-box {
      width: 200px;
      height: 50px;
      margin: 10px 0;
      padding: 10px;
      color: white;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 5px;
      font-family: Arial, sans-serif;
    }

    /* Named color */
    .named-color {
      background-color: tomato;
    }

    /* Hexadecimal */
    .hex-color {
      background-color: #3498db;
    }

    /* RGB */
    .rgb-color {
      background-color: rgb(46, 204, 113);
    }

    /* RGBA */
    .rgba-color {
      background-color: rgba(155, 89, 182, 0.7);
    }

    /* HSL */
    .hsl-color {
      background-color: hsl(200, 70%, 50%);
    }

    /* HSLA */
    .hsla-color {
      background-color: hsla(340, 90%, 55%, 0.6);
    }
  </style>
</head>
<body>
  <h1>CSS Color Reference Demo</h1>

  <div class="color-box named-color">Named Color: Tomato</div>
  <div class="color-box hex-color">Hex Color: #3498db</div>
  <div class="color-box rgb-color">RGB Color: rgb(46, 204, 113)</div>
  <div class="color-box rgba-color">RGBA Color: rgba(155, 89, 182, 0.7)</div>
  <div class="color-box hsl-color">HSL Color: hsl(200, 70%, 50%)</div>
  <div class="color-box hsla-color">HSLA Color: hsla(340, 90%, 55%, 0.6)</div>
</body>
</html>
