<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Background Image with Tilt and Fixed Position</title>
  <style>
    body {
      height: 200vh; /* enough height to scroll */
      margin: 0;
      position: relative;
      font-family: Arial, sans-serif;
      background-color: #f0f0f0;
    }

    /* Fixed container for background image */
    .bg-container {
      position: fixed;
      top: 50%; /* halfway down */
      left: 50%; /* center horizontally */
      width: 300px;
      height: 200px;
      transform: translate(-50%, -50%) rotateY(15deg); /* horizontal tilt */
      background-image: url('https://images.pexels.com/photos/1391498/pexels-photo-1391498.jpeg');
      background-size: cover;
      background-repeat: no-repeat;
      background-position: center;
      pointer-events: none; /* allow clicks through */
      z-index: -1; /* behind content */
      box-shadow: 0 0 10px rgba(0,0,0,0.3);
      border-radius: 8px;
    }

    /* Sample content */
    h1, p {
      text-align: center;
      margin-top: 100px;
      color: #333;
    }
  </style>
</head>
<body>

  <div class="bg-container"></div>

  <h1>Scroll up or down</h1>
  <p>The background image is fixed, horizontally tilted, and positioned halfway down the page.</p>

</body>
</html>
