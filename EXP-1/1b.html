<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hyperlinks with &lt;a&gt; Tag</title>
</head>
<body>
    <h1>HTML Hyperlinks Example</h1>

    <p>
        Visit
        <a href="https://www.google.com">Google</a>
        to search the web.
    </p>

    <p>
        Visit
        <a href="https://www.google.com/url?sa=i&url=https%3A%2F%2Fwww.facebook.com%2FBeautifulFlowerspk%2F&psig=AOvVaw3F2NaylecqH-f22n8W3r9U&ust=1758436623551000&source=images&cd=vfe&opi=89978449&ved=0CBIQjRxqFwoTCLC88Izd5o8DFQAAAAAdAAAAABAK" target="_blank">Flower image</a>
        (opens in a new tab).
    </p>

    <p>
        Go to
        <a href="https://www.example.com" target="_self">Example.com</a>
        (opens in the same tab).
    </p>

    <p>
        Send email to
        <a href="mailto:someone@example.com">someone@example.com</a>.
    </p>

    <p>
        Jump to
        <a href="#footer">Footer Section</a>
        below.
    </p>

    <h2 id="footer">Footer Section</h2>
    <p>This is the footer of the page.</p>
</body>
</html>
